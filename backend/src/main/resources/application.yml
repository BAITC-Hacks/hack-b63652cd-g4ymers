server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: astana-city-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hackalem}
    username: ${DATABASE_USER:hackalem}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
app:
  demo:
    enabled: ${DEMO_RESIDENTS:false}
    password: ${DEMO_RESIDENT_PASSWORD:}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
  token-hours: 24
  bootstrap:
    email: ${AKIM_EMAIL:}
    password: ${AKIM_PASSWORD:}
