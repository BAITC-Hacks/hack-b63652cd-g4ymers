services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: hackalem
      POSTGRES_USER: hackalem
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - city-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackalem -d hackalem"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/hackalem
      DATABASE_USER: hackalem
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      AKIM_EMAIL: ${AKIM_EMAIL:?Set AKIM_EMAIL}
      AKIM_PASSWORD: ${AKIM_PASSWORD:?Set AKIM_PASSWORD}
      DEMO_RESIDENTS: ${DEMO_RESIDENTS:-false}
      DEMO_RESIDENT_PASSWORD: ${DEMO_RESIDENT_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
    depends_on:
      db:
        condition: service_healthy
volumes:
  city-db:
